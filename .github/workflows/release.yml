# Publish a GitHub Release with built APKs when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Signing is OPTIONAL and off by default. `make release` produces an *unsigned*
# release APK, which cannot be installed on a phone as-is. If you add the four
# keystore secrets below, this workflow zipaligns and signs it into an
# installable app-release.apk; without them it still publishes the unsigned
# release APK plus the always-installable debug APK.
#
# To enable signing, set these repository secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks/.keystore  (base64 -w0 key.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password (often same as the store password)
name: Release

on:
  push:
    tags: ["v*"]
  # Allow cutting a release build by hand against the current ref, too.
  workflow_dispatch:

# gh release create needs write access to the repo's Releases.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Surfaced as an env var so later steps can gate on "is a keystore
      # configured?" — secrets cannot be referenced directly in `if:`.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Pin the SDK to the repo-local path (see ci.yml for why the runner's
      # pre-exported ANDROID_SDK_ROOT would otherwise win).
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('Makefile', 'make/sdk.sh') }}

      - name: Install Android SDK
        run: make sdk

      - name: Build debug and release APKs
        run: |
          make debug
          make release

      # Zipalign + sign the unsigned release APK, but only when a keystore secret
      # is present. Uses the build-tools shipped by `make sdk` (pinned in the
      # Makefile), so apksigner/zipalign versions match the build.
      - name: Sign release APK
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      # Collect whatever we produced under a flat dist/ dir with clear names.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/app-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/app-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/app-release-unsigned.apk"
          fi
          ls -la dist

      # Create the Release from the tag (or a lightweight one for manual runs)
      # using the gh CLI — no third-party action, just the built-in token.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          # workflow_dispatch runs on a branch, not a tag; synthesize one so the
          # release has something to hang off of.
          case "${{ github.ref_type }}" in
            tag) ;;
            *) tag="manual-${{ github.run_number }}"; git tag "$tag"; git push origin "$tag" ;;
          esac
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            dist/*
